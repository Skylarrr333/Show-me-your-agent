name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run eval
      - run: npm run build
      - run: npm run build:next
      - run: docker build -t propmatch-agent:ci .
      - name: HTTPS access, workflow and persistent session smoke test
        run: bash scripts/ci-container-smoke.sh
