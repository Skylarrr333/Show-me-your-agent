services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SESSION_DIR: /app/storage
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - sessions:/app/storage
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  sessions:
  caddy_data:
  caddy_config:
